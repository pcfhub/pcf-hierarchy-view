<!DOCTYPE html>
<!--
  The control, rendered in a real browser, for looking at.

      npm run build
      npm run harness            then open /dev/preview.html on that server,
                                 or point headless Chrome at it for a picture

  **Why this exists alongside `smoke.js`.** That file loads the same bundle in
  Node and asserts what the control *decided*. This one renders it, and the two
  answer different questions: a chevron drawn over a badge, a guide line one
  pixel off its column, are invisible to every assertion and obvious in a
  picture.

  **And why it is a browser page rather than `react-dom/server`.** The tree is
  loaded by effects — the chain, then each open node's children — and the
  server renderer runs none of them, so it can only ever show the loading
  state. Here they run against the rig's Web API, which answers from
  `fixture.js`.

  Fluent is `fluent-stub.js`: `FluentProvider` is a `<div>` publishing only the
  tokens the theme carries, `Button` a real button with its appearance as a
  class, `Spinner` a CSS ring. Every `var(--colorX, fallback)` in the stylesheet
  resolves to its literal fallback, which is the honest limit of this page — it
  shows layout and the fallbacks, not the real Fluent palette a form supplies.

  Query parameters, all optional:

    ?identity=none         an unsaved record: the save-first state
    ?hierarchical=false    the lookup nobody flagged: the fallback route
    ?relationships=403     the metadata read refused (also 0 for offline)
    ?webapi=false          no Web API: the not-available state
    ?webapifails=1         a Web API that refuses: the error state
    ?security=no-access    field-level security denies read
    ?details=a,b           detail columns (default address1_city, revenue)
    ?depth=2               levels open at start
    ?max=1                 children per node
    ?sample=<json>         sample data instead of a query
    ?expand=k1,g1          click those nodes' chevrons after the tree loads
    ?showall=p1            press Show all children on that ancestor
    ?dark=1  ?rtl=1        theme and direction
    ?width=320             the width the host allocates (and the page's)
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Hierarchy View — preview</title>
    <link rel="stylesheet" href="../out/controls/HierarchyView/css/HierarchyView.css" />
    <style>
        /* Nothing here styles the control; this is the host page's ground. */
        body { margin: 0; padding: 16px; background: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif; }
        body.is-dark { background: #292929; }
        #root { max-width: 100%; }
        /* A headless screenshot is taken at t=0 of every transition. */
        * { transition: none !important; animation: none !important; }
    </style>
</head>
<body>
<div id="root"></div>

<script src="../node_modules/react/umd/react.development.js"></script>
<script src="../node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="fixture.js"></script>
<script src="host.js"></script>
<script>
    // The stub reads React off these two names, as harness.html sets them.
    window.__harnessReact = window.React;
    window.__harnessReactDOM = window.ReactDOM;
</script>
<script src="fluent-stub.js"></script>

<script>
    /*
      The platform globals, under the names the bundle asks for. `pcf-scripts`
      maps a `<platform-library>` version onto the build it supports, so Fluent
      9.46.2 arrives as `FluentUIReactv940`. A version bump that changes those
      names fails loudly on the bundle's first line rather than rendering an
      empty box.
    */
    window.Reactv16 = window.React;
    window.FluentUIReactv940 = window.__harnessFluent;

    var registration = window.__pcfHost.captureRegistration(window);
</script>

<script src="../out/controls/HierarchyView/bundle.js"></script>

<script>
    (function () {
        'use strict';

        var host = window.__pcfHost;
        var fixture = window.__pcfFixture;
        var params = new URLSearchParams(window.location.search);
        var root = document.getElementById('root');

        if (typeof registration.ctor !== 'function') {
            root.textContent = 'The bundle registered no control. Run npm run build.';

            return;
        }

        var width = Number(params.get('width')) || (window.innerWidth - 32);
        var dark = params.get('dark') === '1';

        if (dark) {
            document.body.classList.add('is-dark');
        }

        root.style.width = width + 'px';

        var hierarchical = params.get('hierarchical');
        var options = {
            valueType: 'Lookup.Simple',
            column: 'parentaccountid',
            target: 'account',
            value: fixture.parentLookup,
            contextInfo: params.get('identity') === 'none' ? null : { entityId: fixture.current, entityTypeName: 'account' },
            fixture: fixture,
            clientUrl: host.nextClientUrl(),
            width: width,
            dark: dark,
            rtl: params.get('rtl') === '1',
            webAPI: params.get('webapi') !== 'false',
            webApiFails: params.get('webapifails') === '1',
            relationshipsStatus: params.has('relationships') ? Number(params.get('relationships')) : 200,
            hierarchical: hierarchical === 'true' ? true : hierarchical === 'false' ? false : undefined,
            security: params.get('security') || 'none',
            label: 'Parent Account',
            inputs: {
                detailColumns: params.has('details') ? params.get('details') : 'address1_city, revenue',
                initialDepth: params.has('depth') ? Number(params.get('depth')) : 1,
                maxChildren: params.has('max') ? Number(params.get('max')) : 50,
                sampleData: params.get('sample') || '',
            },
        };

        var instance = new registration.ctor();
        var context = host.createContext(options);

        function paint() {
            ReactDOM.render(instance.updateView(context), root);
        }

        instance.init(context, paint, {}, root);
        paint();

        /*
          For a *captured* picture: headless Chrome cannot click, so the states
          worth photographing arrange themselves once the tree has loaded.
        */
        function rowNamed(id) {
            var name = (fixture.tables.account.filter(function (row) { return row.accountid === id; })[0] || {}).name;

            return Array.prototype.slice.call(document.querySelectorAll('[role=treeitem]')).filter(function (li) {
                var title = li.querySelector('.HierarchyView-name, .HierarchyView-open');

                return title && title.textContent === name;
            })[0];
        }

        function press(ids, selector) {
            ids.forEach(function (id) {
                var row = rowNamed(id);
                var button = row && row.querySelector(selector);

                if (button) {
                    button.click();
                }
            });
        }

        var expand = (params.get('expand') || '').split(',').filter(Boolean);
        var showAll = (params.get('showall') || '').split(',').filter(Boolean);

        if (expand.length || showAll.length) {
            setTimeout(function () {
                press(showAll, '.HierarchyView-showall');
                press(expand, '.HierarchyView-toggle');
                // A second pass for nodes that only appeared after the first,
                // pressing only chevrons that are still closed.
                setTimeout(function () {
                    press(expand, '.HierarchyView-toggle:not(.HierarchyView-toggle--open)');
                }, 200);
            }, 150);
        }
    })();
</script>
</body>
</html>
