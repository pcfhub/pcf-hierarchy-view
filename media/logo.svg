<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A three-node tree: one record above, a bar, two records below, and the
       lower-left one hollowed to say "this record".

       The control draws a record's ancestors above it and its children below,
       so the mark is the smallest tree that has both: a parent, and a level
       with a sibling in it. Three nodes because two is a link (pcf-toolkit's
       chain) and four is a grid (pcf-grid-cell-styler's card). The connector
       is a T with drops, not a fan of diagonals, because diagonals thin to
       nothing at 24px and read as a wishbone.

       The hollow is a stroke, not a tint: an outlined node keeps its hole at
       24, where a 0.35 fill goes soft and reads as a smudge. It marks the
       record the form is open on, which is the one thing the control exists to
       place. It sits lower left so the silhouette is not symmetric; symmetric
       and it read as a molecule.

       The ramp is the family's, verbatim and userSpaceOnUse, spanning the
       canvas so one light falls across all five pieces. Node 28 and stroke 10
       are the heaviest that leave 8 units of air between the bar and the
       nodes at 24px; at 12 the drops merge into the nodes and the bottom row
       becomes one bar.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="hierarchy-view-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>

  <!-- The parent. -->
  <rect x="34" y="6" width="28" height="28" rx="8" fill="url(#hierarchy-view-ramp)"/>

  <!-- The connector: a stem, the bar, two drops. One path, one paint. -->
  <path d="M43 34 H53 V44 H76 A5 5 0 0 1 81 49 V62 H71 V54 H25 V62 H15 V49 A5 5 0 0 1 20 44 H43 Z" fill="url(#hierarchy-view-ramp)"/>

  <!-- This record: hollow. -->
  <rect x="11" y="67" width="18" height="18" rx="4" stroke="url(#hierarchy-view-ramp)" stroke-width="10"/>

  <!-- Its sibling. -->
  <rect x="62" y="62" width="28" height="28" rx="8" fill="url(#hierarchy-view-ramp)"/>
</svg>
